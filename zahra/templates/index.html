



<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Zahra GPT</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="int-mode">
<div class="container">
  <h1>Zahra GPT</h1>
  <div id="answer"></div>
  <textarea id="question" placeholder="質問を入力..."></textarea>
  <div class="mode-toggle">
    <div id="modeInt" class="mode-btn active" onclick="setMode('int')">内部</div>
    <div id="modeExt" class="mode-btn" onclick="setMode('ext')">外部</div>
  </div>
  <div class="buttons">
    <button class="send-btn" onclick="ask()">送信</button>
  </div>
  <footer>Zahra GPT v1.0</footer>
</div>
<script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
